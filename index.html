    body {
      background-color: #0B0616;
      color: #F3E8FF;
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
    }

    /* Fondo ambiental sutil */
    .ambient-glow {
      background:
        radial-gradient(circle at 15% 15%, rgba(168, 85, 247, 0.14) 0%, transparent 45%),
        radial-gradient(circle at 85% 80%, rgba(45, 22, 87, 0.45) 0%, transparent 50%),
        #0B0616;
    }

    /* Scrollbar personalizado */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0B0616;
    }
    ::-webkit-scrollbar-thumb {
      background: #2D1657;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #A855F7;
    }

    /* Animaciones de entrada de mensajes */
    @keyframes fadeSlideUp {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .msg-enter {
      animation: fadeSlideUp 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Indicador de escritura */
    .typing-dot {
      animation: typingBounce 1.4s infinite ease-in-out both;
    }
    .typing-dot:nth-child(1) { animation-delay: -0.32s; }
    .typing-dot:nth-child(2) { animation-delay: -0.16s; }
    @keyframes typingBounce {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
      40% { transform: scale(1); opacity: 1; }
    }

    /* Póster fallback estilizado */
    .poster-fallback {
      background: linear-gradient(145deg, #2D1657 0%, #120924 55%, #1E0E3E 100%);
    }
  </style>
</head>

     * Incluye los campos internos `idealPara` y `fraseEjemplo` exclusivamente para el criterio del modelo.

    function buildCatalogForSystemPrompt() {
      return MOVIE_CATALOG.map(m => (

    function buildSystemInstruction() {

2. NUNCA menciones ni cites textualmente los campos internos [Guía interna - Ideal para cuando] ni [Guía interna - Frase ejemplo]. Úsalos únicamente de manera silenciosa para comprender qué película encaja mejor con la persona.
3. FLUJO DE PROFUNDIZACIÓN OBLIGATORIO (MÍNIMO 3 INTERVENCIONES DEL USUARIO ANTES DE RECOMENDAR):

   - Si userTurnCount es 1: Escucha activamente lo que compartió, valida sus emociones de forma empática y sin juzgar, y haz una pregunta abierta y cálida para profundizar en los matices de lo que siente o en el tipo de experiencia emocional que busca hoy (por ejemplo: si necesita desconectar, catarsis, algo suave y contemplativo, ritmo ágil, compañía o reflexión). En este turno debes devolver "isRecommendation": false.
   - Si userTurnCount es 2: Recoge con cercanía todo lo que el usuario ha compartido hasta ahora, confirma que comprendes los matices de su estado subjetivo y haz una última pregunta breve de sintonía fina (o confirma un último matiz sobre el ritmo/atmósfera que prefiere para terminar de afinar la elección) anunciando con calidez que ya estás preparando una película muy especial para acompañarle. En este turno debes devolver "isRecommendation": false.
   - Si userTurnCount es >= 3: Ya has escuchado y comprendido profundamente al usuario. Ahora debes entregar la recomendación final ("isRecommendation": true).
4. REGLA DE EXCEPCIÓN SI NO HAY COINCIDENCIA EXACTA:
   - Si el estado de ánimo o pedido específico del usuario no encaja exactamente con ninguna película del catálogo disponible, DEBES aclararlo explícitamente y con empatía en tu mensaje (por ejemplo: diciendo claramente que en este momento no tienes una película que se ajuste exactamente a ese estado de ánimo tan particular, pero que has elegido una obra principal y tres alternativas cercanas que podrían resonar muy bien con lo que busca). Pon "noExactMatch": true en el JSON. Si sí hay una buena coincidencia, pon "noExactMatch": false.

${buildCatalogForSystemPrompt()}`;

    /**
     * Llamada a Gemini API con exponential backoff
     */
    async function callGeminiAPI() {
      const apiKey = ""; // Inyectado automáticamente en tiempo de ejecución
      const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

      const contents = chatHistory.map(turn => ({
        role: turn.role,
        parts: [{ text: turn.text }]
      }));

      const payload = {
        contents,
        systemInstruction: {
          parts: [{ text: buildSystemInstruction() }]
        },
        generationConfig: {
          responseMimeType: "application/json",
          responseSchema: RESPONSE_SCHEMA,
          temperature: 0.75
        }
      };

      const delays = [1000, 2000, 4000, 8000];
      let lastError = null;

      for (let attempt = 0; attempt <= delays.length; attempt++) {
        try {
          const response = await fetch(apiUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          if (!response.ok) {
            throw new Error(`HTTP error ${response.status}`);
          }

          const result = await response.json();
          const rawText = result?.candidates?.[0]?.content?.parts?.[0]?.text;
          if (!rawText) {
            throw new Error("Respuesta vacía del modelo");
          }

          return JSON.parse(rawText);
        } catch (err) {
          lastError = err;
          if (attempt < delays.length) {
            await new Promise(res => setTimeout(res, delays[attempt]));
          }
        }
      }

      throw lastError;
    }

    /**
     * Escapa HTML para evitar inyecciones XSS en texto libre
     */
    function escapeHTML(str) {
      if (!str) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    /**
     * Formatea saltos de línea y negritas sencillas en texto conversacional
     */
    function formatMessageText(text) {
      const escaped = escapeHTML(text);
      return escaped
        .replace(/\*\*(.*?)\*\*/g, '<strong class="text-purple-100 font-semibold">$1</strong>')
        .replace(/\n/g, '<br>');
    }

    /**
     * Busca una película por ID con respaldo seguro si el LLM devolviera un ID aproximado
     */
    function findMovieById(id, excludeIds = []) {
      let found = MOVIE_CATALOG.find(m => m.id === id && !excludeIds.includes(m.id));
      if (!found && id) {
        const lower = id.toLowerCase();
        found = MOVIE_CATALOG.find(m =>
          !excludeIds.includes(m.id) &&
          (m.id.includes(lower) || m.titulo.toLowerCase().includes(lower))
        );
      }
      if (!found) {
        found = MOVIE_CATALOG.find(m => !excludeIds.includes(m.id));
      }
      return found;
    }

    /**

    function appendRecommendationMessage(data) {

      const rawSecIds = Array.isArray(data.secondaryMovieIds) ? data.secondaryMovieIds : [];
      const rawSecWhys = Array.isArray(data.secondaryWhyFits) ? data.secondaryWhyFits : [];

      for (let i = 0; i < 3; i++) {
        const secMovie = findMovieById(rawSecIds[i], usedIds);
        if (secMovie) {
          usedIds.push(secMovie.id);
          secondaryMovies.push({
            movie: secMovie,
            whyFits: rawSecWhys[i] || `Una alternativa con atmósfera ${secMovie.tono.toLowerCase()} que acompaña la sensibilidad que compartiste hoy.`
          });
        }
      }

      const primaryWhy = data.primaryWhyFitsToday || primaryMovie.porQueVerla;

      // Guardamos en estado global para abrir el modal al hacer clic
      lastRecommendations = {
        primary: { movie: primaryMovie, whyFits: primaryWhy },
        secondaries: secondaryMovies
      };

      const wrapper = document.createElement('div');
      wrapper.className = 'flex items-start gap-3 msg-enter';

      const noMatchBadge = data.noExactMatch
        ? `<div class="mb-3 inline-flex items-center gap-2 px-3 py-1.5 rounded-xl bg-[#2D1657]/80 border border-[#C084FC]/40 text-xs text-purple-200">
            <span class="w-2 h-2 rounded-full bg-[#C084FC]"></span>
            <span>Sugerencia afín explorando nuevos matices para tu momento</span>
           </div>`
        : '';

      wrapper.innerHTML = `
        <div class="w-8 h-8 rounded-xl bg-[#190D33] border border-[#C084FC]/40 flex items-center justify-center shrink-0 mt-0.5 shadow-md">
          <svg class="w-4 h-4" viewBox="0 0 32 32" fill="none">
            <rect x="4" y="6" width="24" height="5" rx="1.5" fill="#2D1657" stroke="#C084FC" stroke-width="1.6"/>
            <rect x="4" y="12.5" width="24" height="14" rx="2" fill="#120924" stroke="#C084FC" stroke-width="1.6"/>
            <path d="M13.5 16.5L19.5 19.5L13.5 22.5V16.5Z" fill="#C084FC"/>
          </svg>
        </div>

        <div class="flex-1 min-w-0 space-y-5">
          <!-- Mensaje introductorio empático -->
          <div class="rounded-2xl rounded-tl-sm px-4 py-3.5 bg-[#120924] border border-[#2D1657] text-purple-100/95 text-sm sm:text-base leading-relaxed shadow-lg">
            ${noMatchBadge}
            <div>${formatMessageText(data.message)}</div>
          </div>

          <!-- TARJETA DE PELÍCULA PRINCIPAL RECOMENDADA -->
          <article class="rounded-3xl bg-gradient-to-b from-[#190D33] to-[#120924] border border-[#C084FC]/40 overflow-hidden shadow-2xl shadow-purple-950/60">
            <div class="px-5 py-3 bg-[#2D1657]/60 border-b border-[#3B1E73] flex items-center justify-between">
              <span class="text-xs font-semibold uppercase tracking-widest text-[#C084FC] flex items-center gap-2">
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.9 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l7.1-1.01L12 2z"/></svg>
                Elección principal para ti
              </span>
              <span class="text-xs text-purple-300/80">${escapeHTML(primaryMovie.categoria)}</span>
            </div>

            <div class="p-5 sm:p-6">
              <div class="flex flex-col md:flex-row gap-6">
                <!-- Póster -->
                <div class="w-44 sm:w-48 md:w-52 aspect-[2/3] mx-auto md:mx-0 shrink-0 rounded-2xl overflow-hidden border border-[#C084FC]/30 shadow-xl group">
                  ${renderPosterHTML(primaryMovie)}
                </div>

                <!-- Ficha técnica y emocional -->
                <div class="flex-1 space-y-4">
                  <div>
                    <h2 class="font-serif text-2xl sm:text-3xl font-bold text-white leading-tight">
                      ${escapeHTML(primaryMovie.titulo)} <span class="text-[#C084FC] font-sans font-normal text-lg sm:text-xl">(${escapeHTML(primaryMovie.anio)})</span>
                    </h2>
                    <p class="text-xs sm:text-sm text-purple-200/85 mt-1.5">
                      <strong class="text-purple-100">Dirigida por:</strong> ${escapeHTML(primaryMovie.director)}
                      <span class="mx-2 text-purple-500">|</span>
                      <strong class="text-purple-100">País/Región:</strong> ${escapeHTML(primaryMovie.pais)}
                    </p>
                  </div>

                  <!-- Badges de atributos emocionales -->
                  <div class="flex flex-wrap gap-2 text-xs">
                    <span class="px-3 py-1.5 rounded-xl bg-[#2D1657] border border-[#C084FC]/35 text-purple-100">
                      <strong class="text-[#C084FC]">Emoción principal:</strong> ${escapeHTML(primaryMovie.emocion)}
                    </span>
                    <span class="px-3 py-1.5 rounded-xl bg-[#120924] border border-[#3B1E73] text-purple-200">
                      <strong class="text-[#C084FC]">Tono:</strong> ${escapeHTML(primaryMovie.tono)}
                    </span>
                    <span class="px-3 py-1.5 rounded-xl bg-[#120924] border border-[#3B1E73] text-purple-200">
                      <strong class="text-[#C084FC]">Ritmo:</strong> ${escapeHTML(primaryMovie.ritmo)}
                    </span>
                  </div>

                  <!-- Sinopsis -->
                  <div class="space-y-1">
                    <h3 class="text-xs font-semibold uppercase tracking-wider text-[#C084FC]">Sinopsis</h3>
                    <p class="text-sm text-purple-100/90 leading-relaxed">${escapeHTML(primaryMovie.sinopsis)}</p>
                  </div>

                  <!-- ¿Por qué verla? -->
                  <div class="space-y-1">
                    <h3 class="text-xs font-semibold uppercase tracking-wider text-[#C084FC]">¿Por qué verla?</h3>
                    <p class="text-sm text-purple-100/90 leading-relaxed">${escapeHTML(primaryMovie.porQueVerla)}</p>
                  </div>

                  <!-- ¿Dónde verla? -->
                  <div class="flex items-center gap-2 pt-1 text-sm">
                    <span class="px-3 py-1.5 rounded-xl bg-purple-500/15 border border-purple-400/30 text-purple-100">
                      <strong class="text-[#C084FC]">¿Dónde verla?:</strong> ${escapeHTML(primaryMovie.dondeVerla)}
                    </span>
                  </div>
                </div>
              </div>

              <!-- Explicación reflexiva personalizada -->
              <div class="mt-6 p-4 sm:p-5 rounded-2xl bg-[#2D1657]/55 border border-[#C084FC]/40">
                <h3 class="text-sm font-semibold text-[#E9D5FF] mb-1.5 flex items-center gap-2">
                  <svg class="w-4 h-4 text-[#C084FC] shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
                  </svg>
                  ¿Por qué esta película se adapta a lo que sientes hoy?
                </h3>
                <p class="text-sm sm:text-[15px] text-purple-50 leading-relaxed">
                  ${formatMessageText(primaryWhy)}
                </p>
              </div>
            </div>
          </article>

          <!-- OTRAS 3 OPCIONES PARA EXPLORAR (SECUNDARIAS Y TERCIARIAS) -->
          <section class="space-y-3">
            <div class="flex items-center justify-between px-1">
              <h3 class="text-sm font-semibold text-purple-200 tracking-wide">
                Otras 3 opciones que también pueden acompañarte
              </h3>
              <span class="text-xs text-purple-300/65">Toca una tarjeta para ver su ficha</span>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3.5">
              ${secondaryMovies.map((item, idx) => `
                <button
                  type="button"
                  data-sec-index="${idx}"
                  class="sec-movie-card group text-left rounded-2xl bg-[#120924] hover:bg-[#190D33] border border-[#2D1657] hover:border-[#C084FC]/60 overflow-hidden transition-all duration-200 shadow-lg flex sm:flex-col active:scale-[0.99]"
                >
                  <div class="w-24 sm:w-full aspect-[2/3] shrink-0 overflow-hidden">
                    ${renderPosterHTML(item.movie)}
                  </div>
                  <div class="p-3.5 flex-1 flex flex-col justify-between">
                    <div>
                      <span class="inline-block text-[10px] font-medium px-2 py-0.5 rounded-md bg-[#2D1657] text-[#C084FC] mb-1.5">
                        ${escapeHTML(item.movie.emocion)}
                      </span>
                      <h4 class="font-semibold text-sm text-purple-50 group-hover:text-[#C084FC] transition-colors line-clamp-2">
                        ${escapeHTML(item.movie.titulo)}
                      </h4>
                      <p class="text-xs text-purple-300/70 mt-0.5">${escapeHTML(item.movie.anio)} · ${escapeHTML(item.movie.director)}</p>
                    </div>
                    <div class="mt-3 inline-flex items-center gap-1 text-xs font-medium text-[#C084FC]">
                      <span>Explorar película</span>
                      <svg class="w-3.5 h-3.5 transition-transform group-hover:translate-x-0.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M5 12h14M12 5l7 7-7 7"/>
                      </svg>
                    </div>
                  </div>
                </button>
              `).join('')}
            </div>
          </section>
        </div>
      `;

      chatMessagesEl.appendChild(wrapper);

      // Enlazar eventos de clic para abrir el modal de cada película secundaria
      wrapper.querySelectorAll('.sec-movie-card').forEach(btn => {
        btn.addEventListener('click', () => {
          const idx = Number(btn.getAttribute('data-sec-index'));
          const selected = secondaryMovies[idx];
          if (selected) {
            openMovieModal(selected.movie, selected.whyFits);
          }
        });
      });

      scrollToBottom();
    }

    /**
     * Abre el modal con toda la ficha completa de una película secundaria/terciaria
     */
    function openMovieModal(movie, whyFitsToday) {
      modalContent.innerHTML = `
        <div class="flex flex-col sm:flex-row gap-6">
          <div class="w-40 sm:w-44 aspect-[2/3] mx-auto sm:mx-0 shrink-0 rounded-2xl overflow-hidden border border-[#C084FC]/35 shadow-xl">
            ${renderPosterHTML(movie)}
          </div>

          <div class="flex-1 space-y-3.5">
            <div>
              <span class="inline-block text-[11px] font-semibold uppercase tracking-wider text-[#C084FC] mb-1">
                ${escapeHTML(movie.categoria)}
              </span>
              <h2 id="modalTitle" class="font-serif text-2xl font-bold text-white leading-tight">
                ${escapeHTML(movie.titulo)} <span class="text-[#C084FC] font-sans font-normal text-base">(${escapeHTML(movie.anio)})</span>
              </h2>
              <p class="text-xs sm:text-sm text-purple-200/85 mt-1">
                <strong class="text-purple-100">Dirigida por:</strong> ${escapeHTML(movie.director)}
                <span class="mx-1.5 text-purple-500">|</span>
                <strong class="text-purple-100">País/Región:</strong> ${escapeHTML(movie.pais)}
              </p>
            </div>

            <div class="flex flex-wrap gap-2 text-xs">
              <span class="px-2.5 py-1 rounded-lg bg-[#2D1657] border border-[#C084FC]/35 text-purple-100">
                <strong class="text-[#C084FC]">Emoción:</strong> ${escapeHTML(movie.emocion)}
              </span>
              <span class="px-2.5 py-1 rounded-lg bg-[#190D33] border border-[#3B1E73] text-purple-200">
                <strong class="text-[#C084FC]">Tono:</strong> ${escapeHTML(movie.tono)}
              </span>
              <span class="px-2.5 py-1 rounded-lg bg-[#190D33] border border-[#3B1E73] text-purple-200">
                <strong class="text-[#C084FC]">Ritmo:</strong> ${escapeHTML(movie.ritmo)}
              </span>
            </div>

            <div>
              <h3 class="text-xs font-semibold uppercase tracking-wider text-[#C084FC] mb-1">Sinopsis</h3>
              <p class="text-sm text-purple-100/90 leading-relaxed">${escapeHTML(movie.sinopsis)}</p>
            </div>

            <div>
              <h3 class="text-xs font-semibold uppercase tracking-wider text-[#C084FC] mb-1">¿Por qué verla?</h3>
              <p class="text-sm text-purple-100/90 leading-relaxed">${escapeHTML(movie.porQueVerla)}</p>
            </div>

            <div class="pt-1">
              <span class="inline-block text-xs sm:text-sm px-3 py-1.5 rounded-xl bg-purple-500/15 border border-purple-400/30 text-purple-100">
                <strong class="text-[#C084FC]">¿Dónde verla?:</strong> ${escapeHTML(movie.dondeVerla)}
              </span>
            </div>
          </div>
        </div>

        <div class="mt-5 p-4 rounded-2xl bg-[#2D1657]/55 border border-[#C084FC]/40">
          <h3 class="text-xs sm:text-sm font-semibold text-[#E9D5FF] mb-1">
            ¿Por qué esta película conecta con lo que sientes hoy?
          </h3>
          <p class="text-sm text-purple-50 leading-relaxed">
            ${formatMessageText(whyFitsToday)}
          </p>
        </div>
      `;

      movieModal.classList.remove('hidden');
      movieModal.classList.add('flex');
      document.body.style.overflow = 'hidden';
    }

    /**
     * Cierra el modal de detalle
     */
    function closeMovieModal() {
      movieModal.classList.add('hidden');
      movieModal.classList.remove('flex');
      document.body.style.overflow = '';
    }

    /**
     * Desplaza suavemente al final del chat
     */
    function scrollToBottom() {
      requestAnimationFrame(() => {
        window.scrollTo({
          top: document.body.scrollHeight,
          behavior: 'smooth'
        });
      });
    }

    /**
     * Muestra u oculta el indicador de carga
     */
    function setLoadingState(loading) {
      isLoading = loading;
      sendBtn.disabled = loading;
      userInput.disabled = loading;
      if (loading) {
        typingIndicator.classList.remove('hidden');
        scrollToBottom();
      } else {
        typingIndicator.classList.add('hidden');
        userInput.focus();
      }
    }

    /**
     * Inicia o reinicia la conversación con el saludo cálido de MUDIE
     */
    function initConversation() {
      chatHistory = [];
      userTurnCount = 0;
      lastRecommendations = null;
      chatMessagesEl.innerHTML = '';

      const welcomeGreeting =
        "Hola, soy MUDIE. Me alegra mucho encontrarte por aquí.\n\nAntes de pensar en títulos o géneros, me gustaría saber cómo estás tú: ¿cómo te sientes hoy o qué tipo de experiencia emocional te gustaría vivir a través de una película?";

      chatHistory.push({ role: 'model', text: welcomeGreeting });
      appendBotMessage(welcomeGreeting);
    }

    /**
     * Procesa el envío de un mensaje del usuario
     */
    async function handleSendMessage(e) {
      e.preventDefault();
      if (isLoading) return;

      const text = userInput.value.trim();
      if (!text) return;

      // Limpiar input y ajustar altura
      userInput.value = '';
      userInput.style.height = 'auto';

      // Registrar turno del usuario
      userTurnCount += 1;
      chatHistory.push({ role: 'user', text });
      appendUserMessage(text);

      setLoadingState(true);

      try {
        const aiResponse = await callGeminiAPI();

        // Asegurar regla de mínimo 3 intercambios antes de entregar recomendación final
        const shouldShowRecommendation = Boolean(aiResponse.isRecommendation) && userTurnCount >= 3;

        chatHistory.push({
          role: 'model',
          text: aiResponse.message
        });

        setLoadingState(false);

        if (shouldShowRecommendation && aiResponse.primaryMovieId) {
          appendRecommendationMessage(aiResponse);
        } else {
          appendBotMessage(aiResponse.message);
        }
      } catch (error) {
        setLoadingState(false);
        const fallbackErrorMsg =
          "Perdona, tuve un pequeño tropiezo al conectar con mis pensamientos cinematográficos. ¿Podrías repetir eso último para que sigamos conversando?";
        appendBotMessage(fallbackErrorMsg);
      }
    }

    // Auto-ajuste de altura del textarea y envío con Enter (sin Shift)
    userInput.addEventListener('input', () => {
      userInput.style.height = 'auto';
      userInput.style.height = Math.min(userInput.scrollHeight, 144) + 'px';
    });

    userInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        chatForm.dispatchEvent(new Event('submit'));
      }
    });

    // Listeners principales
    chatForm.addEventListener('submit', handleSendMessage);
    resetBtn.addEventListener('click', () => {
      if (!isLoading) {
        initConversation();
      }
    });

    closeModalBtn.addEventListener('click', closeMovieModal);
    movieModal.addEventListener('click', (e) => {
      if (e.target === movieModal) {
        closeMovieModal();
      }
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && !movieModal.classList.contains('hidden')) {
        closeMovieModal();
      }
    });

    // Arrancar aplicación al cargar
    window.addEventListener('DOMContentLoaded', initConversation);
  </script>
</body>
</html>
